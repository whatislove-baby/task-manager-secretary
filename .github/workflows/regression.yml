name: Repository regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install locked Node dependencies
        run: npm ci
      - name: Audit all Node dependencies
        run: npm audit --audit-level=moderate
      - name: Install Python dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements-mac.txt
          .venv/bin/python -m pip check
      - name: Install Python dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv\Scripts\python.exe -m pip install -r backend/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv\Scripts\python.exe -m pip check
          exit $LASTEXITCODE
      - name: Install Word renderer (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install --cask libreoffice
          test -x /Applications/LibreOffice.app/Contents/MacOS/soffice
      - name: Prepare verified Word renderer (Windows)
        if: runner.os == 'Windows'
        run: npm run runtime:documents:win
      - name: Typecheck
        run: npm run typecheck
      - name: Python regression (isolated macOS credentials)
        run: npm run test:python:ci
      - name: Frontend and packaging contract regression
        run: npm test
      - name: Build
        run: npm run build
