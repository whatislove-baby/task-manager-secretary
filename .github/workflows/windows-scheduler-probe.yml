name: Windows scheduler probe

on:
  push:
    branches: [windows-scheduler-probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduler:
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install -r backend/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --ignore-scripts
          exit $LASTEXITCODE
      - name: Exercise actual current-user Task Scheduler
        shell: pwsh
        run: node scripts/verify-mail-automation-windows.cjs --source
